<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0c29">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>计时器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            color: #fff;
            overflow-x: hidden;
        }

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
        }

        .bg-orb:nth-child(1) {
            width: 300px;
            height: 300px;
            background: #ff00cc;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .bg-orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: #3333ff;
            bottom: -150px;
            right: -150px;
            animation-delay: -7s;
        }

        .bg-orb:nth-child(3) {
            width: 250px;
            height: 250px;
            background: #00d2ff;
            top: 50%;
            left: 50%;
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.1); }
            50% { transform: translate(-20px, 20px) scale(0.9); }
            75% { transform: translate(20px, 10px) scale(1.05); }
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            width: 100%;
            max-width: 600px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .time-display {
            font-size: 72px;
            font-weight: 300;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            margin-bottom: 40px;
            text-shadow: 0 0 30px rgba(100, 200, 255, 0.4), 0 0 60px rgba(100, 200, 255, 0.2);
            animation: breathe 3s ease-in-out infinite;
            line-height: 1.2;
        }

        @keyframes breathe {
            0%, 100% { text-shadow: 0 0 30px rgba(100, 200, 255, 0.4), 0 0 60px rgba(100, 200, 255, 0.2); }
            50% { text-shadow: 0 0 40px rgba(100, 200, 255, 0.6), 0 0 80px rgba(100, 200, 255, 0.3); }
        }

        .time-display .ms {
            font-size: 36px;
            color: #a0c4ff;
        }

        .time-display.paused {
            animation: none;
            opacity: 0.7;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            padding: 14px 32px;
            font-size: 16px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:active::before {
            width: 300px;
            height: 300px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        button:disabled::before {
            display: none;
        }

        .start {
            background: linear-gradient(135deg, rgba(0, 184, 148, 0.3), rgba(0, 206, 201, 0.3));
            border-color: rgba(0, 206, 201, 0.4);
        }

        .start:hover:not(:disabled) {
            box-shadow: 0 10px 25px rgba(0, 206, 201, 0.3);
        }

        .pause {
            background: linear-gradient(135deg, rgba(253, 203, 110, 0.3), rgba(225, 112, 85, 0.3));
            border-color: rgba(253, 203, 110, 0.4);
        }

        .pause:hover:not(:disabled) {
            box-shadow: 0 10px 25px rgba(253, 203, 110, 0.3);
        }

        .lap {
            background: linear-gradient(135deg, rgba(116, 185, 255, 0.3), rgba(9, 132, 227, 0.3));
            border-color: rgba(116, 185, 255, 0.4);
        }

        .lap:hover:not(:disabled) {
            box-shadow: 0 10px 25px rgba(116, 185, 255, 0.3);
        }

        .reset {
            background: rgba(255, 255, 255, 0.08);
        }

        .icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .lap-section {
            margin-top: 24px;
            text-align: left;
            max-height: 280px;
            overflow-y: auto;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.15);
            padding: 16px;
        }

        .lap-section::-webkit-scrollbar {
            width: 6px;
        }

        .lap-section::-webkit-scrollbar-track {
            background: transparent;
        }

        .lap-section::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .lap-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .lap-title {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .lap-count {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .lap-list {
            list-style: none;
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
            transition: background 0.2s;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .lap-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .lap-item.fastest {
            background: rgba(0, 184, 148, 0.15);
            border-left: 3px solid #00b894;
        }

        .lap-item.slowest {
            background: rgba(225, 112, 85, 0.15);
            border-left: 3px solid #e17055;
        }

        .lap-item.fastest:hover {
            background: rgba(0, 184, 148, 0.25);
        }

        .lap-item.slowest:hover {
            background: rgba(225, 112, 85, 0.25);
        }

        .lap-index {
            width: 40px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
        }

        .lap-split {
            flex: 1;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        .lap-total {
            width: 90px;
            text-align: right;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }

        .lap-diff {
            width: 70px;
            text-align: right;
            font-size: 12px;
            font-weight: 500;
        }

        .lap-diff.positive {
            color: #e17055;
        }

        .lap-diff.negative {
            color: #00b894;
        }

        .clear-laps {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            padding: 4px 8px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .clear-laps:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
        }

        .hint {
            margin-top: 16px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }

        .hint kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 11px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        @media (max-width: 600px) {
            .card {
                padding: 30px 16px;
                margin: 0 10px;
            }

            .time-display {
                font-size: 48px;
            }

            .time-display .ms {
                font-size: 24px;
            }

            button {
                padding: 12px 20px;
                font-size: 14px;
            }

            .lap-section {
                max-height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>
    <div class="bg-orb"></div>

    <div class="container">
        <div class="card">
            <div class="time-display" id="display">00:00:00<span class="ms">.00</span></div>

            <div class="buttons">
                <button class="start" id="startBtn" onclick="start()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <span>开始</span>
                </button>
                <button class="pause" id="pauseBtn" onclick="pause()" disabled>
                    <svg class="icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    <span>暂停</span>
                </button>
                <button class="lap" id="lapBtn" onclick="recordLap()" disabled>
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                    <span>记录</span>
                </button>
                <button class="reset" id="resetBtn" onclick="reset()">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                    <span>重置</span>
                </button>
            </div>

            <div class="lap-section" id="lapSection" style="display:none;">
                <div class="lap-header">
                    <span class="lap-title">中途计时</span>
                    <div>
                        <span class="lap-count" id="lapCount">0 条记录</span>
                        <button class="clear-laps" id="clearLapsBtn" onclick="clearLaps()">清空</button>
                    </div>
                </div>
                <ul class="lap-list" id="lapList"></ul>
            </div>
        </div>

        <div class="hint">
            <kbd>空格</kbd> 开始/暂停 &nbsp; <kbd>R</kbd> 重置 &nbsp; <kbd>L</kbd> 记录
        </div>
    </div>

    <script>
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let isRunning = false;
        let laps = [];

        const display = document.getElementById('display');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const lapBtn = document.getElementById('lapBtn');
        const resetBtn = document.getElementById('resetBtn');
        const lapSection = document.getElementById('lapSection');
        const lapList = document.getElementById('lapList');
        const lapCount = document.getElementById('lapCount');
        const clearLapsBtn = document.getElementById('clearLapsBtn');

        const ORIGINAL_TITLE = document.title;

        function formatTime(ms, showMs = true) {
            const totalSeconds = Math.floor(ms / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            const milliseconds = Math.floor((ms % 1000) / 10);

            const pad = (n) => n.toString().padStart(2, '0');

            if (showMs) {
                return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}<span class="ms">.${pad(milliseconds)}</span>`;
            }
            return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        }

        function formatMsOnly(ms) {
            const milliseconds = Math.floor((ms % 1000) / 10);
            return `.${milliseconds.toString().padStart(2, '0')}`;
        }

        function formatDuration(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            const milliseconds = Math.floor((ms % 1000) / 10);

            const pad = (n) => n.toString().padStart(2, '0');
            return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}.${pad(milliseconds)}`;
        }

        function updateDisplay() {
            const current = Date.now() - startTime + elapsedTime;
            display.innerHTML = formatTime(current);
            document.title = formatDuration(current) + ' - 计时器';
        }

        function start() {
            if (!isRunning) {
                startTime = Date.now();
                timerInterval = setInterval(updateDisplay, 10);
                isRunning = true;
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                lapBtn.disabled = false;
                display.classList.remove('paused');
                startBtn.querySelector('span').textContent = '开始';
            }
        }

        function pause() {
            if (isRunning) {
                clearInterval(timerInterval);
                elapsedTime += Date.now() - startTime;
                isRunning = false;
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                lapBtn.disabled = true;
                display.classList.add('paused');
                startBtn.querySelector('span').textContent = '继续';
                document.title = formatDuration(elapsedTime) + ' (已暂停) - 计时器';
            }
        }

        function reset() {
            clearInterval(timerInterval);
            startTime = 0;
            elapsedTime = 0;
            isRunning = false;
            laps = [];
            display.innerHTML = '00:00:00<span class="ms">.00</span>';
            display.classList.remove('paused');
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            lapBtn.disabled = true;
            startBtn.querySelector('span').textContent = '开始';
            lapSection.style.display = 'none';
            lapList.innerHTML = '';
            document.title = ORIGINAL_TITLE;
        }

        function recordLap() {
            if (!isRunning) return;

            const currentTotal = Date.now() - startTime + elapsedTime;
            const lastTotal = laps.length > 0 ? laps[laps.length - 1].total : 0;
            const split = currentTotal - lastTotal;

            const lap = {
                index: laps.length + 1,
                split: split,
                total: currentTotal,
                diff: laps.length > 0 ? split - laps[laps.length - 1].split : 0
            };

            laps.push(lap);
            renderLaps();
        }

        function renderLaps() {
            if (laps.length === 0) {
                lapSection.style.display = 'none';
                return;
            }

            lapSection.style.display = 'block';
            lapCount.textContent = `${laps.length} 条记录`;

            // Find fastest and slowest
            let fastest = 0, slowest = 0;
            if (laps.length > 1) {
                let min = Infinity, max = -Infinity;
                for (let i = 0; i < laps.length; i++) {
                    if (laps[i].split < min) { min = laps[i].split; fastest = i; }
                    if (laps[i].split > max) { max = laps[i].split; slowest = i; }
                }
            }

            lapList.innerHTML = '';

            // Show in reverse order (newest first)
            for (let i = laps.length - 1; i >= 0; i--) {
                const lap = laps[i];
                const li = document.createElement('li');
                li.className = 'lap-item';
                if (laps.length > 1) {
                    if (i === fastest) li.classList.add('fastest');
                    if (i === slowest) li.classList.add('slowest');
                }

                let diffHtml = '';
                if (lap.index > 1) {
                    const diffMs = lap.diff;
                    const sign = diffMs >= 0 ? '+' : '-';
                    const absMs = Math.abs(diffMs);
                    const diffClass = diffMs >= 0 ? 'positive' : 'negative';
                    diffHtml = `<span class="lap-diff ${diffClass}">${sign}${formatDuration(absMs).replace(/^[0:]+/, '')}</span>`;
                }

                li.innerHTML = `
                    <span class="lap-index">#${lap.index.toString().padStart(2, '0')}</span>
                    <span class="lap-split">${formatDuration(lap.split)}</span>
                    ${diffHtml}
                    <span class="lap-total">${formatDuration(lap.total)}</span>
                `;
                lapList.appendChild(li);
            }

            lapList.scrollTop = 0;
        }

        function clearLaps() {
            if (laps.length === 0) return;
            if (!confirm('确定要清空所有记录吗？')) return;
            laps = [];
            lapSection.style.display = 'none';
            lapList.innerHTML = '';
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (isRunning) pause();
                else start();
            }
            if (e.code === 'KeyR') {
                reset();
            }
            if (e.code === 'KeyL') {
                if (isRunning) recordLap();
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
